name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: XcodeGen, build (Debug+Release), unit tests, demo smoke
    runs-on: macos-26
    timeout-minutes: 90
    env:
      # Pinned sherpa-onnx v1.13.7 iOS XCFramework. Asset choice matters:
      # "ios-shared-onnxruntime-static" is a dynamic framework with
      # onnxruntime statically linked inside (self-contained); the plain
      # "ios-static" asset leaves Ort* symbols undefined. The framework is
      # git-ignored; CI fetches and hash-checks it before generating the
      # Xcode project. No ASR model files are ever downloaded in CI.
      SHERPA_XCFW_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/xcframework/sherpa-onnx-v1.13.7-ios-shared-onnxruntime-static.xcframework.zip
      SHERPA_XCFW_SHA256: 72db1b34ff75c6b4f3f40a73d46c4241e1c2b23599638975c66ad6dec10bb298
    steps:
      - uses: actions/checkout@v4

      - name: Record runner environment
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -i ios || true

      - name: Select Xcode 26.6
        run: |
          set -euo pipefail
          ls /Applications/ | grep -i xcode
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen xcbeautify

      - name: Fetch sherpa-onnx xcframework (hash-pinned)
        run: |
          set -euo pipefail
          curl -fSL --retry 3 "$SHERPA_XCFW_URL" -o /tmp/sherpa-onnx.xcframework.zip
          echo "$SHERPA_XCFW_SHA256  /tmp/sherpa-onnx.xcframework.zip" | shasum -a 256 --check
          # The release zip unpacks under its own top-level name
          # (SherpaOnnxC.xcframework); the project references it as
          # sherpa-onnx.xcframework — rename on unpack.
          rm -rf ThirdParty/SherpaOnnxC.xcframework ThirdParty/sherpa-onnx.xcframework
          unzip -q /tmp/sherpa-onnx.xcframework.zip -d ThirdParty/
          mv ThirdParty/SherpaOnnxC.xcframework ThirdParty/sherpa-onnx.xcframework
          test -d ThirdParty/sherpa-onnx.xcframework/ios-arm64

      - name: Generate Xcode project (XcodeGen)
        run: |
          set -euo pipefail
          xcodegen --version
          xcodegen generate
          xcodebuild -list -project LiveTranslateIOS.xcodeproj

      - name: Build Debug (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project LiveTranslateIOS.xcodeproj \
            -scheme LiveTranslateIOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            build 2>&1 | xcbeautify --quiet

      - name: Build Release (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project LiveTranslateIOS.xcodeproj \
            -scheme LiveTranslateIOS \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            build 2>&1 | xcbeautify --quiet

      - name: Verify build products (appex embedding, bundle IDs)
        run: |
          set -euo pipefail
          for config in Debug Release; do
            app="build/DerivedData/Build/Products/$config-iphonesimulator/LiveTranslateIOS.app"
            test -d "$app"
            test -d "$app/PlugIns/LiveTranslateShareExtension.appex" || { echo "Share .appex not embedded ($config)"; exit 1; }
            test -d "$app/PlugIns/LiveTranslateWidgets.appex" || { echo "Widget .appex not embedded ($config)"; exit 1; }
            plutil -lint "$app/Info.plist"
            plutil -lint "$app/PlugIns/LiveTranslateShareExtension.appex/Info.plist"
            plutil -lint "$app/PlugIns/LiveTranslateWidgets.appex/Info.plist"
            echo "--- $config OK ---"
          done
          # Release must not contain the demo launch path (DemoMode is
          # #if DEBUG-only; assert no compiled artifact references it).
          if strings build/DerivedData/Build/Products/Release-iphonesimulator/LiveTranslateIOS.app/LiveTranslateIOS \
            | grep -q "ui-demo"; then
            echo "Release binary contains the demo launch path"; exit 1
          fi

      - name: Privacy manifest & entitlements checks (round 17)
        run: |
          set -euo pipefail
          app="build/DerivedData/Build/Products/Release-iphonesimulator/LiveTranslateIOS.app"
          share="$app/PlugIns/LiveTranslateShareExtension.appex"
          widgets="$app/PlugIns/LiveTranslateWidgets.appex"

          # 1. Every target ships a PrivacyInfo.xcprivacy, source + product.
          for f in LiveTranslateIOS/PrivacyInfo.xcprivacy \
                   ShareExtension/PrivacyInfo.xcprivacy \
                   Widgets/PrivacyInfo.xcprivacy; do
            test -f "$f"
            plutil -lint "$f"
          done
          test -f "$app/PrivacyInfo.xcprivacy"
          test -f "$share/PrivacyInfo.xcprivacy"
          test -f "$widgets/PrivacyInfo.xcprivacy"

          # 2. Manifest contract: no tracking, no tracking domains, and
          #    exactly the required-reason APIs the source actually uses.
          python3 - <<'EOF'
          import plistlib, sys
          def load(p):
              with open(p, "rb") as fh: return plistlib.load(fh)
          app = load("LiveTranslateIOS/PrivacyInfo.xcprivacy")
          assert app["NSPrivacyTracking"] is False
          assert app["NSPrivacyTrackingDomains"] == []
          assert app["NSPrivacyCollectedDataTypes"] == []
          apis = {a["NSPrivacyAccessedAPIType"] for a in app["NSPrivacyAccessedAPITypes"]}
          assert apis == {
              "NSPrivacyAccessedAPICategoryUserDefaults",
              "NSPrivacyAccessedAPICategoryFileTimestamp",
              "NSPrivacyAccessedAPICategoryDiskSpace",
          }, apis
          share = load("ShareExtension/PrivacyInfo.xcprivacy")
          widgets = load("Widgets/PrivacyInfo.xcprivacy")
          for m in (share, widgets):
              assert m["NSPrivacyTracking"] is False
              assert m["NSPrivacyCollectedDataTypes"] == []
              apis = {a["NSPrivacyAccessedAPIType"] for a in m["NSPrivacyAccessedAPITypes"]}
              assert apis == {"NSPrivacyAccessedAPICategoryUserDefaults"}, apis
          print("privacy manifests OK")
          EOF

          # 3. Face ID usage string present in the built app (the
          #    biometric privacy lock requires it).
          plutil -extract NSFaceIDUsageDescription raw -o - "$app/Info.plist" | grep -q "Face ID"

          # 4. No broad ATS exception in any built plist.
          for plist in "$app/Info.plist" "$share/Info.plist" "$widgets/Info.plist"; do
            if plutil -extract NSAppTransportSecurity.NSAllowsArbitraryLoads raw -o - "$plist" 2>/dev/null | grep -q true; then
              echo "NSAllowsArbitraryLoads found in $plist"; exit 1
            fi
          done

          # 5. Entitlements matrix: the App Group on all three targets and
          #    NOTHING else on the extensions (no keychain access groups
          #    anywhere — extensions must never reach the Keychain).
          for product in "$app" "$share" "$widgets"; do
            codesign -d --entitlements :- "$product" 2>/dev/null > /tmp/ents.plist
            if grep -q "keychain-access-groups" /tmp/ents.plist; then
              echo "keychain-access-groups found in $product"; exit 1
            fi
            grep -q "group.com.livetranslate.ios" /tmp/ents.plist \
              || { echo "App Group missing in $product"; exit 1; }
          done

          # 6. Extension binaries must not carry the Keychain/secret
          #    vocabulary (account names the app's Keychain items use).
          for binary in "$share/LiveTranslateShareExtension" "$widgets/LiveTranslateWidgets"; do
            if strings "$binary" | grep -q "translation.apiKey"; then
              echo "API-key account name leaked into extension binary: $binary"; exit 1
            fi
            if strings "$binary" | grep -q "cloudsync.account"; then
              echo "Sync-token account name leaked into extension binary: $binary"; exit 1
            fi
          done

          # 7. Release carries no debug/localhost endpoint defaults.
          if strings "$app/LiveTranslateIOS" | grep -q "127.0.0.1:8000"; then
            echo "Debug sync endpoint leaked into Release binary"; exit 1
          fi
          echo "privacy checks OK"

      - name: Unit tests (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project LiveTranslateIOS.xcodeproj \
            -scheme LiveTranslateIOS \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Tests.xcresult \
            test 2>&1 | xcbeautify --quiet

      - name: Demo smoke (UI demo launch on Simulator)
        run: |
          set -euo pipefail
          # First AVAILABLE iPhone (any model — runner images vary).
          udid=$(xcrun simctl list devices -j | python3 -c "
          import json,sys
          data=json.load(sys.stdin)['devices']
          for runtime, devices in data.items():
              for d in devices:
                  if d['isAvailable'] and d['name'].startswith('iPhone'):
                      print(d['udid']); sys.exit(0)
          ")
          [ -n "$udid" ] || { xcrun simctl list devices available; echo "no iPhone simulator available"; exit 1; }
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" build/DerivedData/Build/Products/Debug-iphonesimulator/LiveTranslateIOS.app
          launch_out=$(xcrun simctl launch "$udid" com.livetranslate.ios --ui-demo)
          echo "launched: $launch_out"
          sleep 25
          # The process must still be alive after 25 seconds.
          xcrun simctl spawn "$udid" launchctl list | grep -q com.livetranslate.ios
          echo "Demo smoke OK: process alive after 25s"
          xcrun simctl shutdown "$udid" || true

      - name: No model files committed
        run: |
          set -euo pipefail
          # No ONNX / Core ML artifacts may ride along in git.
          bad=$(git ls-files | grep -Ei '\.(onnx|mlpackage|mlmodelc)$|weight\.bin$' || true)
          if [ -n "$bad" ]; then
            echo "Model artifacts found in git:"; echo "$bad"; exit 1
          fi
          # Nothing oversized either.
          git ls-files -z | xargs -0 -I{} stat -f "%z {}" | awk '$1 > 3000000 {print "Large file:", $0; bad=1} END {exit bad+0}'

      - name: No API keys in source
        run: |
          set -euo pipefail
          # Look for obvious credential literals. Allowlist matches that
          # are keys by name (settings identifiers), not values.
          if grep -rnE '(sk-[A-Za-z0-9]{20,}|api[_-]?key\s*[:=]\s*"[^"$\{]{8,}")' \
              --include='*.swift' --include='*.yml' --include='*.py' --include='*.sh' . \
              | grep -v 'apiKey' | grep -v 'api_key'; then
            echo "Possible hard-coded credential found."; exit 1
          fi

      - name: Manifest format check
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, sys
          with open("Resources/ModelManifest.json") as fh:
              m = json.load(fh)
          assert m["schemaVersion"] == 2, "schemaVersion"
          assert m["model"]["id"] == "gigaam-v3-e2e-rnnt"
          assert set(m["backends"]) == {"coreml-fp16", "sherpa-onnx-int8"}
          for key, backend in m["backends"].items():
              assert len(backend["revision"]) == 40, f"{key} revision not a commit SHA"
              assert backend["revision"] not in ("main", "master")
              assert backend["files"], f"{key} has no files"
              total = sum(f["bytes"] for f in backend["files"])
              assert backend["totalDownloadBytes"] == total, f"{key} size sum mismatch"
              for f in backend["files"]:
                  assert len(f["sha256"]) == 64 and all(c in "0123456789abcdef" for c in f["sha256"])
                  assert f["url"].startswith("https://")
                  assert f"/resolve/{backend['revision']}/" in f["url"], f"{f['path']} not pinned"
          assert m["runtime"]["sileroVAD"]["sha256"]
          print("Manifest OK:", len(m["backends"]["coreml-fp16"]["files"]), "coreml files,",
                len(m["backends"]["sherpa-onnx-int8"]["files"]), "sherpa files")
          EOF

      - name: No runtime dependency on the legacy desktop project
        run: |
          set -euo pipefail
          # Source files must not reference the old project's path — the iOS
          # app is fully independent of it.
          if grep -rn '/Users/oo/project/LiveTranslate' --include='*.swift' .; then
            echo "Swift source references the legacy project path."; exit 1
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-failure-diagnostics
          retention-days: 7
          path: |
            build/Tests.xcresult
          if-no-files-found: ignore
