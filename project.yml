name: LiveTranslateIOS
options:
  bundleIdPrefix: com.livetranslate
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    # Simulator builds need no signing identity; device builds are done by
    # the user with their own team selected in Xcode.
    CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "YES"
    # Ad-hoc signing on the simulator keeps entitlements embedded (with the
    # default "iPhone Developer" identity and no team they get stripped).
    CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
    DEVELOPMENT_TEAM: ""

targets:
  LiveTranslateIOS:
    type: application
    platform: iOS
    sources:
      - path: LiveTranslateIOS
      - path: Resources
      # Shared-inbox kit: compiled into BOTH the app and the Share
      # Extension (the App Group storage contract — Foundation only).
      - path: SharedInboxKit
      # System-integration kit: compiled into BOTH the app and the Widget
      # Extension (App Group snapshot / command / route contract +
      # ActivityKit attribute definitions — Foundation + ActivityKit only).
      - path: SharedSystemKit
    dependencies:
      # Official v1.13.7 release asset: dynamic framework with onnxruntime
      # statically linked inside (self-contained; the plain "static"
      # xcframework leaves Ort* symbols undefined with no companion lib).
      - framework: ThirdParty/sherpa-onnx.xcframework
        embed: true
      # Share Extension (智能收件箱 receive side) — embedded into the app.
      - target: LiveTranslateShareExtension
      # Widget Extension (锁屏实时课堂 / 灵动岛 / 小组件 / 控制中心).
      - target: LiveTranslateWidgets
    info:
      path: LiveTranslateIOS/Info.plist
      properties:
        CFBundleDisplayName: LiveTranslate
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        # Deep links arrive ONLY as HTTPS Universal Links (associated
        # domain + server AASA — see Server-Go/docs/ENVIRONMENTS.md §5).
        # No custom URL scheme is registered: scheme links are spoofable
        # by any app and must never carry the reset credential.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities: [arm64]
        # Lock-screen live classroom + Dynamic Island (created only by the
        # app after a real coordinator start; display-only — it never
        # claims to keep ASR alive by itself).
        NSSupportsLiveActivities: true
        # Live Activity content stale-dating: 4h covers a long class with
        # quiet content; push tokens are NOT used (no server component).
        NSSupportsLiveActivitiesFrequentUpdates: false
        NSMicrophoneUsageDescription: >-
          LiveTranslate uses the microphone to recognize Russian speech on
          device with GigaAM-v3 and show a Chinese translation. Audio is
          processed locally and is not saved unless you enable it in Settings.
        NSCameraUsageDescription: >-
          LiveTranslate uses the camera to photograph blackboards and slides
          during class. Photos stay on your device unless you enable cloud
          sync.
        # Exam-center calendar mirroring: WRITE-ONLY access (the app never
        # reads the user's calendars). Requested only when the user taps
        # 加入系统日历; a denial changes nothing in-app.
        NSCalendarsWriteOnlyAccessUsageDescription: >-
          LiveTranslate can add exams and study-plan blocks to a calendar
          you choose. The app only writes events you ask for; it never
          reads your calendars.
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Scoped exception: plain-HTTP is allowed ONLY for local network
          # hosts (Ollama / LM Studio / vLLM on the LAN). Arbitrary loads
          # remain blocked; public endpoints must use HTTPS.
          NSAllowsLocalNetworking: true
        # Private sync server base URL (expanded from the per-config build
        # setting below). Empty in Release until a real HTTPS domain is
        # configured — never a guessed placeholder domain.
        CloudSyncServerURL: $(CLOUD_SYNC_SERVER_URL)
    entitlements:
      path: LiveTranslateIOS/LiveTranslateIOS.entitlements
      properties:
        # Sign in with Apple. Requires an Apple Developer team + capability
        # for device builds; simulator builds compile without it.
        com.apple.developer.applesignin: [Default]
        # Shared inbox (Share Extension ↔ app staging area). Group id is
        # derived from the app's bundle ID prefix — no team id involved.
        com.apple.security.application-groups: [group.com.livetranslate.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livetranslate.ios
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        ENABLE_PREVIEWS: "YES"
      configs:
        # Debug points at the local development server (run uvicorn on
        # 127.0.0.1:8000); plain HTTP is allowed for local networking via
        # the scoped ATS exception above. Release stays EMPTY until the
        # production HTTPS domain is configured — sync then shows
        # 仅保存在本机 instead of guessing an address.
        Debug:
          CLOUD_SYNC_SERVER_URL: http://127.0.0.1:8000/v1
        Release:
          CLOUD_SYNC_SERVER_URL: ""

  # Share Extension (系统分享 → 智能收件箱): receives PDFs, images, text
  # files, plain text and URLs from any app's share sheet, stages them
  # into the shared App Group inbox and commits per-item metadata. It
  # deliberately does nothing else — no SwiftData, no AI, no network.
  LiveTranslateShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      # Same App Group storage contract as the app (Foundation only).
      - path: SharedInboxKit
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: LiveTranslate
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          # Activation: files (≤10), images (≤10), plain text, one web
          # URL/page per share. Extras beyond the caps are refused by the
          # system before the extension even runs.
          NSExtensionActivationRule:
            NSExtensionActivationSupportsText: true
            NSExtensionActivationSupportsWebURLWithMaxCount: 1
            NSExtensionActivationSupportsWebPageWithMaxCount: 1
            NSExtensionActivationSupportsImageWithMaxCount: 10
            NSExtensionActivationSupportsFileWithMaxCount: 10
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.livetranslate.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livetranslate.ios.ShareExtension
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        # Same ad-hoc simulator signing posture as the app target.
        CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
        SKIP_INSTALL: "YES"

  # Widget Extension (锁屏实时课堂 / 灵动岛 / 小组件 / 控制中心控件):
  # renders the App Group snapshot the app maintains, forwards user intents
  # back through the command/route queues, and renders the two Live
  # Activities. It deliberately does nothing else — no SwiftData, no ASR,
  # no Keychain, no networking, no model loading.
  LiveTranslateWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      # Same App Group snapshot / command / route + Live Activity
      # attribute contract as the app (Foundation + ActivityKit only).
      - path: SharedSystemKit
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: LiveTranslate
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/LiveTranslateWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.livetranslate.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livetranslate.ios.Widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        # Same ad-hoc simulator signing posture as the other targets.
        CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
        SKIP_INSTALL: "YES"

  LiveTranslateIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LiveTranslateIOSTests
    dependencies:
      - target: LiveTranslateIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livetranslate.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"

  LiveTranslateIOSIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LiveTranslateIOSIntegrationTests
      # Same golden fixtures as the unit-test target (Russian speech +
      # PyTorch reference transcripts).
      - path: LiveTranslateIOSTests/Fixtures
    dependencies:
      - target: LiveTranslateIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livetranslate.ios.integrationtests
        GENERATE_INFOPLIST_FILE: "YES"

  LiveTranslateIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LiveTranslateIOSUITests
    dependencies:
      - target: LiveTranslateIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livetranslate.ios.uitests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  LiveTranslateIOS:
    build:
      targets:
        LiveTranslateIOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LiveTranslateIOSTests
  LiveTranslateIOSIntegration:
    build:
      targets:
        LiveTranslateIOS: all
    test:
      config: Debug
      targets:
        - LiveTranslateIOSIntegrationTests
      # Model-dependent tests copy from the git-ignored LocalModels/ tree;
      # xcodebuild expands ${...} from its own invocation environment, so
      # run: LIVETRANSLATE_MODELS_DIR=$PWD/LocalModels xcodebuild test ...
      environmentVariables:
        - variable: LIVETRANSLATE_MODELS_DIR
          value: ${LIVETRANSLATE_MODELS_DIR}
          isEnabled: true
